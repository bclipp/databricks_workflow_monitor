[package]
name = "rust_workflow_monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
ratatui = "0.30"
crossterm = "0.29"